[project]
name = "rag"
version = "0.1.0"
description = "Medical RAG pipeline using Ollama and pgvector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.1",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.49",
    "pgvector>=0.4.2",
    "datasets>=4.8.4",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
rag = "rag.cli:main"

[tool.uv]
package = true

[build-system]
requires = [
    "uv_build>=0.6.1,<0.7",
]
build-backend = "uv_build"
