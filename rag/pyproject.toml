[project]
name = "rag"
version = "0.1.0"
description = "Medical RAG pipeline using Ollama and pgvector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "datasets>=3.5",
    "pydantic-settings>=2.7",
]

[project.scripts]
rag = "rag.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = [
    "src",
]
