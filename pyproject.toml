[project]
name = "llm-learning"
version = "0.1.0"
description = "R&D learning project for LLMs, RAG, MCP, and Agents"
requires-python = ">=3.12"
dependencies = [
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff>=0.11",
]

# ---------------------------------------------------------------------------
# mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
pretty = true

[tool.uv.workspace]
members = [
    "rag",
    "agents",
]
