line-length = 88
target-version = "py312"

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle — numpy convention enforced below
    "ANN", # flake8-annotations — enforces type hints
    "C90", # mccabe complexity
    "UP",  # pyupgrade — modernise syntax
    "B",   # flake8-bugbear — opinionated correctness rules
    "RUF", # ruff-specific rules
]
ignore = [
    # ANN401: disallows `Any` — too strict for exploratory R&D code
    "ANN401",
]

[lint.pydocstyle]
# Enforces numpy-style docstrings and automatically resolves D2xx conflicts.
convention = "numpy"

[lint.mccabe]
max-complexity = 10

[lint.isort]
known-first-party = [
    "llm_learning",
]
