[project]
name = "agents"
version = "0.1.0"
description = "Single and multi-agent systems using LangGraph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.0",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.14.0",
    "pgvector>=0.4.2",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "ollama>=0.6.2",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
agents = "agents.cli:main"

[tool.uv]
package = true

[build-system]
requires = [
    "uv_build>=0.6.1,<0.7",
]
build-backend = "uv_build"
